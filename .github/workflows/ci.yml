name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prumo:
    name: mechanical gates (prumo-verify)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the pinned toolchain manifest
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          m = json.load(open("tools/toolchain.json"))
          t = m["targets"]["x86_64-linux"]
          print(f"url={t['url']}")
          print(f"sha256={t['sha256']}")
          print(f"version={m['version']}")
          PY

      - name: Download the pinned Zig release archive
        run: curl -fsSL -o /tmp/zig.tar.xz "${{ steps.pin.outputs.url }}"

      - name: Verify the archive by content hash (O4, SPEC.md section 11.3)
        run: |
          echo "${{ steps.pin.outputs.sha256 }}  /tmp/zig.tar.xz" | sha256sum -c -

      - name: Extract and add to PATH
        run: |
          mkdir -p "$HOME/zig-toolchain"
          tar -xJf /tmp/zig.tar.xz -C "$HOME/zig-toolchain"
          ZIGDIR=$(find "$HOME/zig-toolchain" -maxdepth 1 -type d -name 'zig-*' | head -1)
          echo "$ZIGDIR" >> "$GITHUB_PATH"

      - name: Record the compiler version (M7)
        run: |
          echo "pinned: ${{ steps.pin.outputs.version }}"
          echo "installed: $(zig version)"
          test "$(zig version)" = "${{ steps.pin.outputs.version }}"

      - name: Run prumo-verify (all seven gates)
        run: ./tools/prumo-verify
